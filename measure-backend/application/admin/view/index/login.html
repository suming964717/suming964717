<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeasureMaster 后台管理</title>
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: linear-gradient(135deg, #0f0f1a, #1a1a2e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; width: 380px; }
.login-logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
.login-title { text-align: center; color: white; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.login-sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 32px; }
.form-control { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; border-radius: 10px; padding: 12px 16px; }
.form-control:focus { background: rgba(255,255,255,0.12); border-color: #6C63FF; color: white; box-shadow: 0 0 0 3px rgba(108,99,255,0.2); }
.form-control::placeholder { color: #666; }
.btn-login { background: linear-gradient(135deg, #6C63FF, #8B85FF); border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 700; width: 100%; color: white; }
.btn-login:hover { opacity: 0.9; }
.alert-danger { background: rgba(255,71,87,0.15); border-color: rgba(255,71,87,0.3); color: #ff6b6b; border-radius: 10px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">📐</div>
  <div class="login-title">MeasureMaster</div>
  <div class="login-sub">后台管理系统</div>
  {:isset($error) ? '<div class="alert alert-danger">'.$error.'</div>' : ''}
  <form method="post" action="/admin/index/doLogin">
    <div class="mb-3">
      <input type="text" name="username" class="form-control" placeholder="管理员账号" required>
    </div>
    <div class="mb-4">
      <input type="password" name="password" class="form-control" placeholder="管理员密码" required>
    </div>
    <button type="submit" class="btn btn-login">登 录</button>
  </form>
</div>
</body>
</html>
