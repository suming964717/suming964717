# ============================================================
# 国内中转服务器 Nginx 配置
# 用途：部署在大陆服务器（阿里云/腾讯云），将请求转发到香港源站
# 前提：大陆服务器无需 ICP 备案也可以做纯代理转发
#
# 架构：中国用户 → 国内服务器(本配置) → 香港服务器
# ============================================================

# 香港源站地址（将 HK_SERVER_IP 改为香港服务器真实 IP）
upstream hk_origin {
    server HK_SERVER_IP:443;
    keepalive 64;
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ----------------------------------------------------------
    # SSL 证书（国内服务器申请，域名解析到国内 IP）
    # 申请 Let's Encrypt：certbot --nginx -d your-domain.com
    # ----------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----------------------------------------------------------
    # Gzip 压缩（中转层压缩，减少国内用户下行流量）
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ----------------------------------------------------------
    # 全量反向代理到香港源站
    # ----------------------------------------------------------
    location / {
        proxy_pass          https://hk_origin;
        proxy_http_version  1.1;

        # 透传真实域名（保证 HK 服务器 SSL SNI 正确匹配）
        proxy_ssl_server_name on;
        proxy_ssl_name        your-domain.com;

        # 关闭 SSL 证书验证（若香港服务器使用自签证书则需要此行，正式证书可删除）
        # proxy_ssl_verify off;

        proxy_set_header Host              your-domain.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        # ----------------------------------------------------------
        # 超时设置（国内→香港延迟约 30~60ms，适当放宽）
        # ----------------------------------------------------------
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # ----------------------------------------------------------
        # 缓冲区优化（避免慢连接占用 upstream 连接）
        # ----------------------------------------------------------
        proxy_buffering         on;
        proxy_buffer_size       32k;
        proxy_buffers           8 32k;
        proxy_busy_buffers_size 64k;

        # ----------------------------------------------------------
        # 静态资源在中转层缓存（减少重复请求香港，节省带宽）
        # ----------------------------------------------------------
        # 启用缓存前先创建目录：mkdir -p /var/cache/nginx/cn_relay
        proxy_cache           cn_relay_cache;
        proxy_cache_valid     200 302 1d;
        proxy_cache_valid     404      1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass    $http_pragma $http_authorization;

        # API 请求不缓存
        proxy_no_cache        $http_authorization;
    }
}

# ----------------------------------------------------------
# 缓存区配置（放在 http{} 块中，此处声明供参考）
# 实际使用时将以下内容加入 /etc/nginx/nginx.conf 的 http{} 块：
#
# proxy_cache_path /var/cache/nginx/cn_relay
#     levels=1:2
#     keys_zone=cn_relay_cache:20m
#     max_size=2g
#     inactive=1d
#     use_temp_path=off;
# ----------------------------------------------------------
