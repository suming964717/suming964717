# ============================================================
# Docker Compose 一键部署（香港服务器）
# 使用方法：
#   1. cp .env.example .env  并填写数据库密码
#   2. 将前端构建产物放到 ../measure-app/dist/
#   3. 将 SSL 证书放到 ./ssl/ 目录（fullchain.pem + privkey.pem）
#   4. docker compose up -d
# ============================================================

version: '3.8'

services:

  # ── Nginx 反向代理 + 静态文件服务 ──────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: measure_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-hk-server.conf:/etc/nginx/conf.d/default.conf:ro
      - ../measure-app/dist:/var/www/measure-app/dist:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_net

  # ── ThinkPHP 后端（PHP-FPM + 内置路由）─────────────────────
  backend:
    image: php:8.1-cli
    container_name: measure_backend
    working_dir: /var/www/backend
    command: php -S 0.0.0.0:8000 -t public
    volumes:
      - ../measure-backend:/var/www/backend:ro
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-measure}
      DB_USER: ${DB_USER:-measure_user}
      DB_PASS: ${DB_PASS:?请在 .env 文件中设置 DB_PASS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  # ── MySQL 数据库 ────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: measure_db
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-measure}
      MYSQL_USER:          ${DB_USER:-measure_user}
      MYSQL_PASSWORD:      ${DB_PASS:?请在 .env 文件中设置 DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?请在 .env 文件中设置 DB_ROOT_PASS}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ../measure-backend/sql/measure_master.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_net

volumes:
  mysql_data:
  nginx_logs:

networks:
  app_net:
    driver: bridge
